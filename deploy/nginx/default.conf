# Domain utama -> aplikasi puskesmas baru.
# /api/data/ tetap diarahkan ke aplikasi lama karena layout HTML modul lama
# (Bedas Menanam, dll.) memanggil https://sikapblud.bandungkab.go.id/api/data/... secara langsung.
server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;

    location /api/data/ {
        proxy_pass http://nextjs_app:3000;
    }

    location / {
        proxy_pass http://puskesmas_app:3000;
    }
}

# Aplikasi lama (sementara di port 8080, sampai ada subdomain sendiri).
server {
    listen 8080;
    server_name _;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    location / {
        proxy_pass http://nextjs_app:3000;
    }
}
